<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
</head>
<body class="bg-gray-100 text-gray-900">
    <section>
    <H1 class="text-center text-3xl font-bold">Chiwo's calorie counter</H1>
    <p class="text-center">Welcome to chiwo calorie counter!</p>
    </section>
    <section class="mx-auto my-6 max-w-md rounded-lg bg-white p-5 text-center shadow">
        <h2 class="text-lg font-bold">Today's total</h2>
        <p><output id="total-calories" class="text-3xl font-bold">0</output> calories</p>
        <div class="mt-3 h-2 overflow-hidden rounded bg-gray-200"><div id="progress-bar" class="h-full w-0 bg-blue-500"></div></div>
        <p id="progress-text" class="mt-2 text-sm text-gray-600">Start by adding your first meal.</p>
        <button id="reset-btn" type="button" class="mt-4 rounded border border-gray-300 px-4 py-2 hover:bg-gray-100">Reset day</button>
    </section>
    <section class="bg-[#706c61] ">
        <form id="food-form" class="flex flex-col gap-4 max-w-md mx-auto rounded-lg bg-white p-6 shadow" novalidate>
            <div>
                <label for="food-name" class="mb-1 block font-semibold">Food name</label>
                <div class="flex gap-2">
                    <input type="text" id="food-name" name="foodName" required maxlength="60" placeholder="e.g. Chapati" class="w-full border border-gray-300 rounded px-3 py-2">
                    <button id="suggest-btn" type="button" class="rounded bg-yellow-300 px-3 hover:bg-yellow-400" title="Suggest calories">✨</button>
                </div>
            </div>
            <div>
                <label for="calories" class="mb-1 block font-semibold">Calories</label>
                <input type="number" id="calories" name="calories" required min="1" max="10000" placeholder="e.g. 300" class="w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <p id="form-message" class="hidden text-sm" role="alert"></p>
            <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Add food</button>
        </form>
    </section>
    <section>
        <div class="flex max-w-md mx-auto items-center justify-between">
            <h2 class="text-xl font-bold text-center my-4">Food List</h2>
            <span id="item-count" class="rounded-full bg-gray-200 px-3 py-1 text-sm">0 items</span>
        </div>
        <ul id="food-list" class="max-w-md mx-auto mt-4 space-y-2">
            
            
        </ul>
        <p id="empty-state" class="text-center text-gray-500">No food items added yet.</p>
    </section>
</body>
<script src="script.js"></script>
</html>
